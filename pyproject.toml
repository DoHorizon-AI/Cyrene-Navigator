[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cyrene-navigator"
version = "0.1.0"
description = "Cyrene Navigator built-in Harness component for Native Client, based on DeepSeek harness"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "tzdata==2026.5",
  "uvicorn==0.52.4",
  "cyrene-plugin-runtime @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@219eedb661003d4b24e8bde9c5aed2a202e2b4f3#subdirectory=sdk/python/cyrene_plugin_runtime",
  "cyrene-model-provider-contracts @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@219eedb661003d4b24e8bde9c5aed2a202e2b4f3#subdirectory=sdk/python/cyrene_model_provider_contracts",
  "cyrene-memory-provider-contracts @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@219eedb661003d4b24e8bde9c5aed2a202e2b4f3#subdirectory=sdk/python/cyrene_memory_provider_contracts",
  "cyrene-knowledge-graph-contracts @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@219eedb661003d4b24e8bde9c5aed2a202e2b4f3#subdirectory=sdk/python/cyrene_knowledge_graph_contracts",
  "cyrene-tool-provider-contracts @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@219eedb661003d4b24e8bde9c5aed2a202e2b4f3#subdirectory=sdk/python/cyrene_tool_provider_contracts",
  "cyrene-speech-provider-contracts @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@219eedb661003d4b24e8bde9c5aed2a202e2b4f3#subdirectory=sdk/python/cyrene_speech_provider_contracts",
  "cyrene-integration-contracts @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@219eedb661003d4b24e8bde9c5aed2a202e2b4f3#subdirectory=sdk/python/cyrene_integration_contracts",
  "cyrene-message-connector-contracts @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@219eedb661003d4b24e8bde9c5aed2a202e2b4f3#subdirectory=sdk/python/cyrene_message_connector_contracts",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "mypy==2.3.1",
  "openapi-spec-validator==0.9.0",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyrene_navigator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cyrene_navigator"]
