name: $(Date:yyyyMMdd)$(Rev:.r)

# GitHub Actions owns automatic source, native-host, and contract checks after
# publication. Keep this Azure definition manual for private integration work.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
- job: product_contract
  displayName: 'Navigator / Product Contract and Persistence'
  timeoutInMinutes: 20
  variables:
    UV_CACHE_DIR: '$(Pipeline.Workspace)/.cache/uv'
  steps:
  - checkout: self
  - bash: |
      set -euo pipefail
      mkdir -p "$(Pipeline.Workspace)/.cache/uv"
    displayName: 'Prepare uv cache directory'
  - task: Cache@2
    inputs:
      key: 'uv | "$(Agent.OS)" | "$(Build.Repository.Name)" | uv.lock'
      restoreKeys: |
        uv | "$(Agent.OS)" | "$(Build.Repository.Name)"
      path: '$(Pipeline.Workspace)/.cache/uv'
    displayName: 'Restore uv dependency cache'

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Setup Python 3.12'

  - bash: |
      set -euo pipefail
      python -m pip install --disable-pip-version-check uv==0.12.3
      uv sync --locked --group dev
    displayName: 'Install locked dependencies'

  - bash: |
      set -euo pipefail
      uv run ruff check src tests scripts
      uv run ruff format --check src tests scripts
      uv run mypy src/cyrene_navigator scripts/serve-persistence.py
      uv run pytest -q --junitxml=test-results.xml
      uv run python - <<'PY'
      from pathlib import Path
      from openapi_spec_validator import validate
      from openapi_spec_validator.readers import read_from_filename

      for path in Path("contracts/product/v1").glob("*openapi.yaml"):
          document, base = read_from_filename(str(path.resolve()))
          validate(document, base_uri=base)
          print("Validated", path.name)
      PY
    displayName: 'Lint, type, unit and OpenAPI checks'

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results.xml
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

- job: native_host
  displayName: 'Navigator / Native Host'
  timeoutInMinutes: 20
  variables:
    CARGO_HOME: '$(Pipeline.Workspace)/.cargo'
  steps:
  - checkout: self
  - bash: |
      set -euo pipefail
      mkdir -p "$(Pipeline.Workspace)/.cargo"
      mkdir -p "$(Pipeline.Workspace)/s/Cyrene-Navigator/native/target"
    displayName: 'Prepare Cargo cache directories'
  - task: Cache@2
    inputs:
      key: 'cargo | "$(Agent.OS)" | "$(Build.Repository.Name)" | native/Cargo.lock'
      restoreKeys: |
        cargo | "$(Agent.OS)" | "$(Build.Repository.Name)"
      path: '$(Pipeline.Workspace)/.cargo'
    displayName: 'Restore Cargo registry cache'
  - task: Cache@2
    inputs:
      key: 'cargo-target | "$(Agent.OS)" | "$(Build.Repository.Name)" | native/Cargo.lock'
      restoreKeys: |
        cargo-target | "$(Agent.OS)" | "$(Build.Repository.Name)"
      path: '$(Pipeline.Workspace)/s/Cyrene-Navigator/native/target'
    displayName: 'Restore native Cargo target cache'

  - bash: |
      set -euo pipefail
      export RUSTUP_HOME="$HOME/.rustup"
      mkdir -p "$RUSTUP_HOME"
      rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      rustup override set 1.97.1
      rustc --version | grep -F '1.97.1'
    displayName: 'Install pinned Rust toolchain'

  - bash: |
      set -euo pipefail
      cargo fmt --manifest-path native/Cargo.toml --all -- --check
      rustfmt --edition 2021 --check harness/tests/fixtures/native-matrix-host.rs
      cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      cargo test --manifest-path native/Cargo.toml --workspace --all-targets --locked
    displayName: 'Format, lint and test native host'

- job: harness_integration
  displayName: 'Navigator / Exact Harness Integration'
  timeoutInMinutes: 60
  variables:
    UV_CACHE_DIR: '$(Pipeline.Workspace)/.cache/uv'
    CARGO_HOME: '$(Pipeline.Workspace)/.cargo'
  steps:
  - checkout: self
  - bash: |
      set -euo pipefail
      mkdir -p "$(Pipeline.Workspace)/.cache/uv"
      mkdir -p "$(Pipeline.Workspace)/.cargo"
    displayName: 'Prepare dependency and Cargo cache directories'
  - task: Cache@2
    inputs:
      key: 'uv | "$(Agent.OS)" | "$(Build.Repository.Name)" | uv.lock'
      restoreKeys: |
        uv | "$(Agent.OS)" | "$(Build.Repository.Name)"
      path: '$(Pipeline.Workspace)/.cache/uv'
    displayName: 'Restore uv dependency cache'
  - task: Cache@2
    inputs:
      key: 'cargo | "$(Agent.OS)" | "$(Build.Repository.Name)" | native/Cargo.lock'
      restoreKeys: |
        cargo | "$(Agent.OS)" | "$(Build.Repository.Name)"
      path: '$(Pipeline.Workspace)/.cargo'
    displayName: 'Restore Cargo registry cache'
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
  - task: NodeTool@0
    inputs:
      versionSpec: '24.13.0'
  - bash: |
      set -euo pipefail
      python -m pip install --disable-pip-version-check uv==0.12.3
      uv sync --locked --group dev
      corepack enable
      corepack prepare pnpm@11.7.0 --activate
      export RUSTUP_HOME="$HOME/.rustup"
      mkdir -p "$RUSTUP_HOME"
      rustup toolchain install 1.97.1 --profile minimal
      rustup override set 1.97.1
      node scripts/prepare-harness.mjs --install --build --link
      node .upstream/deepseek-harness/node_modules/typescript/bin/tsc -p harness/tsconfig.json
      node .upstream/deepseek-harness/node_modules/typescript/bin/tsc -p harness/tsconfig.client.json
      node scripts/windows/build-harness-client.mjs
      cargo build --manifest-path native/Cargo.toml --package cyrene-native-host --locked
    displayName: 'Build exact Harness, adapters and native host'
  - bash: |
      set -euo pipefail
      node --test \
        harness/tests/delivery-feedback.test.mjs \
        harness/tests/persistence.integration.test.mjs \
        harness/tests/import-codex.integration.test.mjs \
        harness/tests/input-receipts.integration.test.mjs \
        harness/tests/compaction.test.mjs \
        harness/tests/session-titles.test.mjs \
        harness/tests/profile.integration.test.mjs \
        harness/tests/native.integration.test.mjs
    env:
      CYRENE_DSH_ROOT: $(Build.SourcesDirectory)/.upstream/deepseek-harness
      CYRENE_TEST_PYTHON: $(Build.SourcesDirectory)/.venv/bin/python
      CYRENE_NATIVE_HOST: $(Build.SourcesDirectory)/native/target/debug/cyrene-native-host
    displayName: 'Run real persistence, native import and Profile integration'

- job: native_windows
  displayName: 'Navigator / Windows Native Host'
  pool:
    vmImage: windows-latest
  timeoutInMinutes: 120
  steps:
  - checkout: self
  - task: NodeTool@0
    inputs:
      versionSpec: '24.13.0'
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      npm install --global pnpm@11.7.0
      rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy
      if ((node --version).Trim() -ne 'v24.13.0') { throw 'Node pin mismatch.' }
      if ((pnpm --version).Trim() -ne '11.7.0') { throw 'pnpm pin mismatch.' }
    displayName: 'Install pinned Windows tools'
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      node scripts/prepare-harness.mjs --root (Join-Path $env:AGENT_TEMPDIRECTORY 'deepseek-harness') --install --build --link
      if ($LASTEXITCODE -ne 0) { throw 'Harness source verification failed.' }
      cargo +1.97.1-x86_64-pc-windows-msvc fmt --manifest-path native/Cargo.toml --all -- --check
      cargo +1.97.1-x86_64-pc-windows-msvc clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      cargo +1.97.1-x86_64-pc-windows-msvc test --manifest-path native/Cargo.toml --workspace --all-targets --locked
    displayName: 'Build Harness adapters and check the Windows native host'
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      $upstream = Join-Path $env:AGENT_TEMPDIRECTORY 'deepseek-harness'
      $nativeRoot = Join-Path $env:AGENT_TEMPDIRECTORY 'cyrene-native-host'
      node scripts/prepare-harness.mjs --root $upstream --link
      if ($LASTEXITCODE -ne 0) { throw 'Harness source verification failed.' }
      pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/build-native-host.ps1 -OutputRoot $nativeRoot
      if ($LASTEXITCODE -ne 0) { throw 'Static native host build failed.' }
      $fixture = Join-Path $env:AGENT_TEMPDIRECTORY 'native-matrix-host.exe'
      rustc +1.97.1-x86_64-pc-windows-msvc --edition 2021 -C opt-level=2 `
        harness/tests/fixtures/native-matrix-host.rs -o $fixture
      if ($LASTEXITCODE -ne 0) { throw 'Native matrix fixture build failed.' }
      $env:CYRENE_NATIVE_MATRIX_BINARY = $fixture
      $env:CYRENE_NATIVE_HOST = Join-Path $nativeRoot 'cyrene-native-host.exe'
      $env:CYRENE_DSH_ROOT = $upstream
      node --test harness/tests/native.integration.test.mjs
      if ($LASTEXITCODE -ne 0) { throw 'Windows native supervisor matrix failed.' }
      node --test harness/tests/windows-native-imports.test.mjs
    displayName: 'Run native supervisor matrix without a desktop shell'

- job: architecture_boundary
  displayName: 'Governance / Platform Independence'
  timeoutInMinutes: 10
  steps:
  - checkout: self
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
  - bash: python scripts/ci/check-platform-boundary.py
    displayName: 'Reject Platform source coupling and mock leakage'

- job: evidence
  displayName: 'Navigator / Assemble Evidence'
  dependsOn:
    - product_contract
    - native_host
    - harness_integration
    - native_windows
    - architecture_boundary
  condition: succeeded()
  steps:
  - checkout: none
  - bash: |
      set -euo pipefail
      mkdir -p ci/evidence
      cat > ci/evidence/navigator-summary.json <<EOF
      {
        "suite": "Cyrene-Navigator",
        "commit": "$(Build.SourceVersion)",
        "build_id": "$(Build.BuildId)",
        "status": "PASS",
        "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      }
      EOF
    displayName: 'Generate sanitized evidence'
  - publish: ci/evidence
    artifact: navigator-evidence
    displayName: 'Publish evidence artifact'
