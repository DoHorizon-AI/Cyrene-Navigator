# Navigator composition over the exact upstream base and application bundle.
# Navigator 通过组合复用上游；会话只有 Cyrene persistence 一个可写真源。
- id: session-persistence-jsonl
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: llm-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: agent-preset-registry
  config:
    default: cyrene-navigator

- insert:
    - id: preset-cyrene-navigator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cyrene-navigator
        name: Navigator
        description: Chat, workspace tools, skills and workflows through your selected model.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Cyrene Navigator, an assistant powered by the {{model}} model.
                Your selected working directory is {{cwd}}. Use tools when needed and
                explain their results clearly. Import, Export and Send to are explicit
                user actions; do not initiate training or deployment from a conversation
                without the user's request.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js dshHomePath('skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: workflow
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@cyrene/navigator-harness/compaction'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

- id: agent-default-model
  config:
    provider: cyrene-exchange
    model: !!js process.env.CYRENE_HARNESS_MODEL

# Reuse the upstream provider adapter. Personal profiles may add external
# providers through its existing settings UI; the adoption proof uses Exchange.
# 复用成熟 Provider 插件；个人配置可添加外部 Provider，验收固定经过 Exchange。
- id: llm-pi-ai
  config:
    providers:
      cyrene-exchange:
        displayName: Cyrene Exchange
        api: openai-completions
        baseURL: !!js process.env.CYRENE_EXCHANGE_URL
        apiKeyEnv: CYRENE_EXCHANGE_TOKEN
        models:
          - id: !!js process.env.CYRENE_HARNESS_MODEL
            contextWindow: !!js Number(process.env.CYRENE_HARNESS_CONTEXT_WINDOW || 8192)
            maxTokens: !!js Number(process.env.CYRENE_HARNESS_MAX_TOKENS || 2048)
            input: [text]

- insert:
    - id: cyrene-navigator-bundle
      name: '@cyrene/navigator-harness'

    - id: cyrene-persistence
      name: '@cyrene/navigator-harness/persistence'
      config:
        baseUrl: !!js process.env.CYRENE_PERSISTENCE_URL
        workspaceId: !!js process.env.CYRENE_WORKSPACE_ID
        tokenEnv: CYRENE_SESSION_TOKEN
        clientId: !!js process.env.CYRENE_DEVICE_ID || 'navigator'

    - id: cyrene-session-control
      name: '@cyrene/navigator-harness/session-control'

    - id: cyrene-session-titles
      name: '@cyrene/navigator-harness/session-titles'

    - id: cyrene-codex-import
      name: '@cyrene/navigator-harness/import'
      config:
        binary: !!js process.env.CYRENE_NATIVE_HOST
