components:
  schemas:
    AppendRequest:
      properties:
        writerToken:
          type: string
          maxLength: 512
          minLength: 1
          title: Writertoken
        epoch:
          type: integer
          minimum: 0.0
          title: Epoch
        batchId:
          type: string
          maxLength: 512
          minLength: 1
          title: Batchid
        events:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 10000
          minItems: 1
          title: Events
      additionalProperties: false
      type: object
      required:
      - writerToken
      - epoch
      - batchId
      - events
      title: AppendRequest
      description: Request one idempotent append batch. | 请求一个幂等追加批次。
    EchoReceipt:
      properties:
        targetResource:
          $ref: '#/components/schemas/TargetResource'
        status:
          type: string
          enum:
          - DRAFT
          - STARTED
          title: Status
        openIn:
          type: string
          title: Openin
      additionalProperties: false
      type: object
      required:
      - targetResource
      - status
      - openIn
      title: EchoReceipt
    EventsView:
      properties:
        events:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Events
        nextSeq:
          type: integer
          minimum: 0.0
          title: Nextseq
      additionalProperties: false
      type: object
      required:
      - events
      - nextSeq
      title: EventsView
      description: Contiguous event slice and its committed end cursor. | 连续事件片段。
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HandleOpenRequest:
      properties:
        access:
          type: string
          enum:
          - read
          - write
          title: Access
        clientId:
          type: string
          maxLength: 200
          minLength: 1
          title: Clientid
        takeoverExpectedEpoch:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Takeoverexpectedepoch
      additionalProperties: false
      type: object
      required:
      - access
      - clientId
      title: HandleOpenRequest
      description: Request a read or write handle for an existing session. | 打开读写句柄。
    HandleView:
      properties:
        id:
          type: string
          title: Id
        header:
          additionalProperties: true
          type: object
          title: Header
        inheritedEventCount:
          type: integer
          minimum: 0.0
          title: Inheritedeventcount
        access:
          type: string
          enum:
          - read
          - write
          title: Access
        nextSeq:
          type: integer
          minimum: 0.0
          title: Nextseq
        epoch:
          type: integer
          minimum: 0.0
          title: Epoch
        writerToken:
          anyOf:
          - type: string
          - type: 'null'
          title: Writertoken
        leaseExpiresAt:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Leaseexpiresat
      additionalProperties: false
      type: object
      required:
      - id
      - header
      - inheritedEventCount
      - access
      - nextSeq
      - epoch
      title: HandleView
      description: Wire representation of a server-authorized persistence handle. | 服务端句柄。
    MutationRequest:
      properties:
        writerToken:
          type: string
          maxLength: 512
          minLength: 1
          title: Writertoken
        epoch:
          type: integer
          minimum: 0.0
          title: Epoch
      additionalProperties: false
      type: object
      required:
      - writerToken
      - epoch
      title: MutationRequest
      description: Authenticate a writer mutation. | 认证写入变更。
    MutationView:
      properties:
        nextSeq:
          type: integer
          minimum: 0.0
          title: Nextseq
        leaseExpiresAt:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Leaseexpiresat
      additionalProperties: false
      type: object
      required:
      - nextSeq
      title: MutationView
      description: Mutation acknowledgement with an optional renewed lease. | 变更确认。
    ProductMetadata:
      properties:
        workspaceId:
          type: string
          maxLength: 512
          minLength: 1
          title: Workspaceid
        sessionId:
          type: string
          maxLength: 512
          minLength: 1
          title: Sessionid
        creatorActorId:
          anyOf:
          - type: string
          - type: 'null'
          title: Creatoractorid
        ownerActorId:
          anyOf:
          - type: string
          - type: 'null'
          title: Owneractorid
        ownerState:
          type: string
          enum:
          - known
          - unknown
          title: Ownerstate
        metadataVersion:
          type: integer
          minimum: 1.0
          title: Metadataversion
        source:
          type: string
          enum:
          - cyrene
          - legacy
          title: Source
        createdAt:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Createdat
      additionalProperties: false
      type: object
      required:
      - workspaceId
      - sessionId
      - ownerState
      - metadataVersion
      - source
      title: ProductMetadata
      description: 'Read-only Navigator metadata separate from the Harness event log.


        The creator and owner are Product identities, while the persistence writer

        lease remains an independent mutable capability. Legacy rows deliberately

        expose an unknown owner instead of inferring one from an old writer.


        Navigator 产品元数据与 Harness 事件日志分离；旧记录无法可靠判断 owner 时明确标记

        unknown/legacy，不从可变的 writer lease 倒推身份。'
    SendToEcho:
      properties:
        expectedRevision:
          type: string
          minLength: 1
          title: Expectedrevision
        selectedEventSeqs:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 2000
            minItems: 1
          - type: 'null'
          title: Selectedeventseqs
        provenanceRefs:
          items:
            type: string
          type: array
