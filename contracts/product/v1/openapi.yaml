# ┌─────────────────────────────────────────────────────────────────────┐
# │  Navigator aggregation API v1                                       │
# │  Returns observed views and never becomes Product state authority.  │
# └─────────────────────────────────────────────────────────────────────┘
openapi: 3.1.2
x-cyrene-contract-profile: product-http-v1
info:
  title: Cyrene Navigator Aggregation API
  version: 1.0.0
  license: {name: Apache-2.0}
paths:
  /api/v1/workspace-snapshots:
    post:
      operationId: observeWorkspaceSnapshot
      description: Authenticated safe aggregation over the caller's scoped Workspace
      security:
        - NavigatorProductBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SnapshotRequest'}
      responses:
        '200':
          description: Complete, partial, or failed observed view
          content:
            application/json:
              schema: {$ref: './workspace-snapshot.schema.json'}
        '401':
          description: Missing or unknown bearer credential (RFC 9457)
          content:
            application/problem+json:
              schema: {$ref: './generated/common/problem-details.schema.json'}
        '403':
          description: Principal is not scoped to the requested organization and Workspace
          content:
            application/problem+json:
              schema: {$ref: './generated/common/problem-details.schema.json'}
        '503':
          description: Internal service or exact owner/org/Workspace configuration is missing
          content:
            application/problem+json:
              schema: {$ref: './generated/common/problem-details.schema.json'}
        '422':
          description: RFC 9457 invalid aggregation request
          content:
            application/problem+json:
              schema: {$ref: './generated/common/problem-details.schema.json'}
components:
  securitySchemes:
    NavigatorProductBearer:
      type: http
      scheme: bearer
      description: Server-configured principal bound to an organization and Workspace
  schemas:
    SnapshotRequest:
      type: object
      required: [workspaceId, reads]
      properties:
        workspaceId: {type: string, minLength: 1, maxLength: 200}
        reads:
          type: array
          minItems: 1
          maxItems: 50
          items:
            oneOf:
              - type: object
                required: [product, path]
                properties:
                  product: {const: CATALYST}
                  path: {const: '/internal/workspace/v1/datasets'}
                additionalProperties: false
              - type: object
                required: [product, path]
                properties:
                  product: {const: ECHO}
                  path:
                    type: string
                    maxLength: 100
                    pattern: '^/internal/workspace/v1/evaluation-suites/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
                additionalProperties: false
              - type: object
                required: [product, path]
                properties:
                  product: {const: EXCHANGE}
                  path: {const: '/api/v1/workspace/gateway-routes'}
                additionalProperties: false
              - type: object
                required: [product, path]
                properties:
                  product: {const: REACTOR}
                  path: {const: '/internal/workspace/v1/model-imports'}
                additionalProperties: false
              - type: object
                required: [product, path]
                properties:
                  product: {const: YIELD}
                  path:
                    type: string
                    maxLength: 100
                    pattern: '^/internal/workspace/v1/training-drafts/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
                additionalProperties: false
      additionalProperties: false
