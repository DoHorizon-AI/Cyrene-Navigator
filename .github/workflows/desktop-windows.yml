name: desktop-windows

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/desktop-windows.yml'
      - 'apps/desktop/**'
      - 'apps/windows/**'
      - 'harness/**'
      - 'native/**'
      - 'scripts/prepare-harness.mjs'
      - 'scripts/windows/build-native-host.ps1'
      - 'scripts/windows/native-imports.mjs'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/desktop/README.md'
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
    paths:
      - '.github/workflows/desktop-windows.yml'
      - 'apps/desktop/**'
      - 'apps/windows/**'
      - 'harness/**'
      - 'native/**'
      - 'scripts/prepare-harness.mjs'
      - 'scripts/windows/build-native-host.ps1'
      - 'scripts/windows/native-imports.mjs'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/desktop/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.13.0'
  PNPM_VERSION: '11.7.0'
  RUST_TOOLCHAIN: '1.97.1-x86_64-pc-windows-msvc'

jobs:
  windows-quality:
    name: windows / web-ui-native-quality
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Verify pinned tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((node --version).Trim() -ne "v${env:NODE_VERSION}") { throw 'Node pin mismatch.' }
          if ((pnpm --version).Trim() -ne $env:PNPM_VERSION) { throw 'pnpm pin mismatch.' }
          if ((rustc --version).Trim() -notmatch '1\.97\.1') { throw 'Rust 1.97.1 is required.' }

      - name: Build browser WebUI
        working-directory: apps/desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check native host and Windows client
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path native/Cargo.toml --workspace --all-targets --locked
          pwsh -NoProfile -ExecutionPolicy Bypass -File apps/windows/build.ps1 -TypeCheckOnly

      - name: Type-check the Release path (preview fixtures excluded)
        working-directory: apps/windows
        run: dotnet build tools/typecheck/TypeCheck.csproj -c Release -t:Build -v q --nologo

      - name: Check the Navigator API adapters headlessly
        working-directory: apps/windows
        run: dotnet run --project tools/adaptercheck/ApiAdapterCheck.csproj -v q --nologo

  native-integration:
    name: windows / native-supervisor
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare exact Harness source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $upstream = Join-Path $env:RUNNER_TEMP 'deepseek-harness'
          node scripts/prepare-harness.mjs --root $upstream --install --build --link
          if ($LASTEXITCODE -ne 0) { throw 'Harness source verification failed.' }
          "CYRENE_DSH_ROOT=$upstream" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build static native host
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $output = Join-Path $env:RUNNER_TEMP 'cyrene-native-host'
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/build-native-host.ps1 -OutputRoot $output
          if ($LASTEXITCODE -ne 0) { throw 'Static native host build failed.' }
          $native = Join-Path $output 'cyrene-native-host.exe'
          if (-not (Test-Path $native -PathType Leaf)) { throw 'Native host is missing.' }
          "CYRENE_NATIVE_HOST=$native" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run native supervisor matrix
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $fixture = Join-Path $env:RUNNER_TEMP 'native-matrix-host.exe'
          rustc --edition 2021 -C opt-level=2 harness/tests/fixtures/native-matrix-host.rs -o $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native matrix fixture build failed.' }
          $env:CYRENE_NATIVE_MATRIX_BINARY = $fixture
          node --test harness/tests/native.integration.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows native supervisor matrix failed.' }

      - name: Verify native imports
        run: node --test harness/tests/windows-native-imports.test.mjs
