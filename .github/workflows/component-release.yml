name: Immutable component release

on:
  push:
    branches: [main, release, develop]
    # Workflow edits require explicit publication. 工作流修改需手动发布。
    paths-ignore:
      - '.github/workflows/component-release.yml'
  pull_request:
    branches: [main, release, develop]
  workflow_dispatch:
    inputs:
      catalog_release_id:
        description: Immutable Workspace component catalog release ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  product-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check uv==0.12.3
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run openapi-spec-validator contracts/product/v1/openapi.yaml
      - run: uv run openapi-spec-validator contracts/product/v1/persistence.openapi.yaml

  product-native-build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [product-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target_profile: linux-ubuntu-22.04-x86_64-python-3.12
          - runner: ubuntu-24.04
            target_profile: linux-ubuntu-24.04-x86_64-python-3.12
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CHANNEL: ${{ github.ref == 'refs/heads/develop' && 'preview' || 'stable' }}
      RELEASE_ID: ${{ (github.ref == 'refs/heads/develop' && 'preview-' || 'stable-') }}${{ github.sha }}
      TARGET_PROFILE: ${{ matrix.target_profile }}
      CATALOG_HELPER_SOURCE_COMMIT: 098ce4affb2fac38754eb18bd40ed679377d4c25
      CATALOG_RELEASE_ID: ${{ inputs.catalog_release_id || (github.ref == 'refs/heads/develop' && vars.CYRENE_PREVIEW_COMPONENT_CATALOG_RELEASE_ID) || (github.ref != 'refs/heads/develop' && vars.CYRENE_STABLE_COMPONENT_CATALOG_RELEASE_ID) || '' }}
      WORKSPACE_BUILDER_COMMIT: cda6fb5104373293575342b2e6868cdd98a3d626
    steps:
      - name: Check out exact Product source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: product-source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the fixed catalog verifier and schemas
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Workspace
          ref: ${{ env.CATALOG_HELPER_SOURCE_COMMIT }}
          path: catalog-helper
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            packaging/fetch_component_catalog.py
            packaging/catalog_metadata.py
            packaging/component_updates.py
            governance/component-catalog-v1.json
            governance/component-catalog-v1.schema.json
            governance/component-release-manifest-v1.schema.json
            governance/component-release-manifest-v2.schema.json
            governance/component-release-index-v1.schema.json
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12 release runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned catalog verifier dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 rfc8785==0.1.4 uv==0.12.3

      - name: Verify exact Product source and fetch signed immutable catalog
        id: catalog
        env:
          CATALOG_RELEASE_ID: ${{ env.CATALOG_RELEASE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C product-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          case "$CHANNEL:$SOURCE_REF" in
            stable:refs/heads/main|stable:refs/heads/release|preview:refs/heads/develop) ;;
            *) echo "release channel does not match the exact source ref" >&2; exit 2 ;;
          esac
          test "$RELEASE_ID" = "$CHANNEL-$SOURCE_COMMIT"
          mkdir -p workspace-catalog/governance
          for schema in \
            component-catalog-v1.schema.json \
            component-release-manifest-v1.schema.json \
            component-release-manifest-v2.schema.json \
            component-release-index-v1.schema.json; do
            cp "catalog-helper/governance/$schema" workspace-catalog/governance/
          done
          args=(--output workspace-catalog/governance/component-catalog-v1.json \
            --metadata-output workspace-catalog/component-catalog-release.json \
            --schema-root catalog-helper/governance)
          if [[ -n "$CATALOG_RELEASE_ID" ]]; then
            args+=(--release-id "$CATALOG_RELEASE_ID")
          else
            args+=(--latest-channel "$CHANNEL")
          fi
          python catalog-helper/packaging/fetch_component_catalog.py "${args[@]}"
          catalog_sha256="$(python - workspace-catalog/component-catalog-release.json <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          metadata_path = Path(sys.argv[1])
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          raw_path = Path("workspace-catalog/governance/component-catalog-v1.json")
          digest = metadata.get("catalogSha256")
          channel = os.environ["CHANNEL"]
          source_commit = metadata.get("sourceCommit")
          allowed_refs = {"preview": {"refs/heads/develop"}, "stable": {"refs/heads/main", "refs/heads/release"}}
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("verified catalog metadata has an invalid raw catalog digest")
          if metadata.get("repository") != "DoHorizon-AI/Cyrene-Workspace" or metadata.get("workflow") != "DoHorizon-AI/Cyrene-Workspace/.github/workflows/component-catalog-release.yml":
              raise SystemExit("verified catalog metadata does not identify the trusted Workspace publisher")
          if metadata.get("channel") != channel or not isinstance(source_commit, str) or re.fullmatch(r"[0-9a-f]{40}", source_commit) is None:
              raise SystemExit("verified catalog channel or source commit differs from this release")
          if metadata.get("releaseId") != f"catalog-{channel}-{source_commit}" or metadata.get("sourceRef") not in allowed_refs[channel]:
              raise SystemExit("verified catalog tag or source ref does not match its channel")
          generation = metadata.get("generation")
          if not isinstance(generation, int) or isinstance(generation, bool):
              raise SystemExit("verified catalog generation is not an integer")
          actual = hashlib.sha256(raw_path.read_bytes()).hexdigest()
          if digest != f"sha256:{actual}":
              raise SystemExit("verified catalog metadata digest does not match downloaded raw bytes")
          print(actual)
          PY
          )"
          echo "CATALOG_SHA256=$catalog_sha256" >> "$GITHUB_ENV"
          echo "catalog_sha256=$catalog_sha256" >> "$GITHUB_OUTPUT"

      - name: Set component output path
        run: echo "OUTPUT_ROOT=$RUNNER_TEMP/component-release" >> "$GITHUB_ENV"

      - name: Bootstrap the trusted Platform SDK index from the fixed catalog locator
        id: sdk-index
        env:
          CATALOG_PATH: workspace-catalog/governance/component-catalog-v1.json
          INDEX_PATH: ${{ runner.temp }}/platform-component-release-index-v1.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path
          import rfc8785

          catalog_path = Path(os.environ["CATALOG_PATH"])
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          publisher_id = "DoHorizon-AI/Cyrene-Platform"
          publisher = next((row for row in catalog["publishers"] if row.get("repository") == publisher_id), None)
          if publisher is None:
              raise SystemExit("trusted catalog does not identify the Platform publisher")
          discovery = publisher.get("releaseDiscovery", {})
          api_uri = discovery.get("apiUri")
          if api_uri != "https://api.github.com/repos/DoHorizon-AI/Cyrene-Platform/releases?per_page=100":
              raise SystemExit("Platform release discovery URI differs from the static catalog authority")
          if discovery.get("indexAssetName") != "component-release-index-v1.json":
              raise SystemExit("trusted Platform index asset name is unsupported")
          channel = os.environ["CHANNEL"]
          prerelease = channel == "preview"
          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
          headers = {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          request = urllib.request.Request(api_uri, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              releases = json.loads(response.read().decode("utf-8"))
          if not isinstance(releases, list):
              raise SystemExit("GitHub Releases API returned an invalid response")
          candidates = [
              row for row in releases
              if isinstance(row, dict)
              and row.get("draft") is False
              and row.get("immutable") is True
              and row.get("prerelease") is prerelease
              and isinstance(row.get("tag_name"), str)
              and row["tag_name"].startswith(channel + "-")
          ]
          candidates.sort(key=lambda row: str(row.get("published_at") or row.get("created_at") or ""), reverse=True)
          allowed_refs = set(catalog.get("channels", {}).get(channel, {}).get("sourceRefs", []))
          target = next(
              row.get("target") for row in catalog["targets"]
              if row.get("id") == "linux-ubuntu-24.04-x86_64-python-3.12-library"
          )
          selected = None
          for release in candidates:
              tag = release["tag_name"]
              asset = next(
                  (item for item in release.get("assets", []) if item.get("name") == "component-release-index-v1.json"),
                  None,
              )
              expected_uri = f"https://github.com/DoHorizon-AI/Cyrene-Platform/releases/download/{tag}/component-release-index-v1.json"
              if not isinstance(asset, dict) or asset.get("browser_download_url") != expected_uri:
                  continue
              download = urllib.request.Request(expected_uri, headers={"Accept": "application/octet-stream"})
              with urllib.request.urlopen(download, timeout=30) as response:
                  if urllib.parse.urlparse(response.geturl()).hostname not in {
                      "github.com", "release-assets.githubusercontent.com", "objects.githubusercontent.com"
                  }:
                      raise SystemExit("Platform release index redirected outside GitHub asset hosts")
                  raw = response.read()
              try:
                  index = json.loads(raw.decode("utf-8", "strict"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  continue
              source = index.get("source", {}) if isinstance(index, dict) else {}
              commit = source.get("commit")
              ref = source.get("ref")
              digest = index.get("indexDigest")
              attestation = index.get("provenance", {}).get("attestation", {})
              digest_input = {key: value for key, value in index.items() if key != "indexDigest"} if isinstance(index, dict) else {}
              actual_digest = "sha256:" + hashlib.sha256(rfc8785.dumps(digest_input)).hexdigest()
              sdk_release = next(
                  (item for item in index.get("releases", [])
                   if item.get("componentId") == "cyrene-runtime-maintenance-sdk" and item.get("target") == target),
                  None,
              )
              if (
                  index.get("schemaVersion") != 1
                  or index.get("repository") != publisher_id
                  or index.get("channel") != channel
                  or actual_digest != digest
                  or ref not in allowed_refs
                  or not isinstance(commit, str)
                  or re.fullmatch(r"[0-9a-f]{40}", commit) is None
                  or tag != f"{channel}-{commit}"
                  or attestation.get("kind") != "github-artifact-attestation"
                  or attestation.get("subjectName") != "component-release-index-v1.json"
                  or attestation.get("repository") != publisher_id
                  or attestation.get("workflow") != "DoHorizon-AI/Cyrene-Platform/.github/workflows/component-release.yml"
                  or sdk_release is None
              ):
                  continue
              Path(os.environ["INDEX_PATH"]).write_bytes(raw)
              selected = (commit, ref)
              break
          if selected is None:
              raise SystemExit(f"no trusted immutable Platform {channel} index includes the Runtime Maintenance SDK")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_commit={selected[0]}\n")
              output.write(f"source_ref={selected[1]}\n")
              output.write(f"index_path={os.environ['INDEX_PATH']}\n")
              output.write(f"index_digest={index['indexDigest']}\n")
          PY

      - name: Verify the Platform index attestation before using its source commit
        env:
          INDEX_PATH: ${{ steps.sdk-index.outputs.index_path }}
          INDEX_SOURCE_REF: ${{ steps.sdk-index.outputs.source_ref }}
          INDEX_SOURCE_COMMIT: ${{ steps.sdk-index.outputs.source_commit }}
        run: |
          set -euo pipefail
          gh attestation verify "$INDEX_PATH" \
            --repo DoHorizon-AI/Cyrene-Platform \
            --signer-workflow DoHorizon-AI/Cyrene-Platform/.github/workflows/component-release.yml \
            --source-ref "$INDEX_SOURCE_REF" \
            --source-digest "$INDEX_SOURCE_COMMIT" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json >/dev/null

      - name: Check out the exact Platform SDK producer and release tools
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Platform
          ref: ${{ steps.sdk-index.outputs.source_commit }}
          path: platform-tools
          persist-credentials: false

      - name: Check out the exact Workspace Product bundle builder
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Workspace
          ref: ${{ env.WORKSPACE_BUILDER_COMMIT }}
          path: workspace-builder
          persist-credentials: false

      - name: Install pinned release tooling
        run: python -m pip install --disable-pip-version-check build pyyaml pytest -r platform-tools/tooling/release/requirements.txt

      - name: Prove immutable release is enabled and unused
        env:
          CYRENE_IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.CYRENE_IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -euo pipefail
          python platform-tools/tooling/release/preflight_component_release.py \
            --repository "$SOURCE_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --channel "$CHANNEL" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --repository-root product-source

      - name: Test the attested Platform release tooling
        env:
          PYTHONPATH: platform-tools
          CYRENE_COMPONENT_CATALOG: workspace-catalog/governance/component-catalog-v1.json
          CYRENE_COMPONENT_CATALOG_SHA256: ${{ steps.catalog.outputs.catalog_sha256 }}
        run: python -m pytest platform-tools/tooling/release/tests -q

      - name: Validate and fetch the Platform SDK from its immutable index
        env:
          INDEX_PATH: ${{ steps.sdk-index.outputs.index_path }}
          PLATFORM_SOURCE_COMMIT: ${{ steps.sdk-index.outputs.source_commit }}
        run: |
          set -euo pipefail
          python platform-tools/tooling/release/validate_component_schema.py \
            --kind index \
            --document "$INDEX_PATH" \
            --schema-dir workspace-catalog/governance
          python platform-tools/tooling/release/component_artifacts.py verify-index \
            --index "$INDEX_PATH" \
            --catalog workspace-catalog/governance/component-catalog-v1.json \
            --verify-run \
            --verify-attestation
          python platform-tools/tooling/release/fetch_component.py \
            --catalog workspace-catalog/governance/component-catalog-v1.json \
            --component cyrene-runtime-maintenance-sdk \
            --target-id linux-ubuntu-24.04-x86_64-python-3.12-library \
            --channel "$CHANNEL" \
            --source-commit "$PLATFORM_SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/platform-sdk-fetch" \
            > "$RUNNER_TEMP/platform-sdk-fetch-result.json"

      - name: Prepare the exact native CPython and pinned uv runtime
        id: python-runtime
        env:
          PYTHON_RUNTIME_SCRIPT: workspace-builder/packaging/python_runtime.py
        run: |
          set -euo pipefail
          python3 "$PYTHON_RUNTIME_SCRIPT" prepare \
            --lock workspace-builder/packaging/python-runtime.lock.json \
            --release-lock workspace-builder/release-lock.json \
            --target-profile "$TARGET_PROFILE" \
            --stage-root "$RUNNER_TEMP/cyrene-python-stage" \
            --work-dir "$RUNNER_TEMP/cyrene-python-work" \
            --json > "$RUNNER_TEMP/python-runtime-receipt.json"
          python3 - "$RUNNER_TEMP/python-runtime-receipt.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("stagedPythonExecutable", "uvExecutable"):
              value = receipt.get(key)
              if not isinstance(value, str) or not value.startswith("/"):
                  raise SystemExit(f"Python runtime receipt has no absolute {key}")
              print(f"{key}={value}")
          PY

      - name: Validate Product owner catalog and build immutable payloads
        id: prepare
        env:
          PLATFORM_SOURCE_COMMIT: ${{ steps.sdk-index.outputs.source_commit }}
          PRODUCT_ID: cyrene-navigator
          PRODUCT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python platform-tools/tooling/release/validate_product_contract.py \
            --repository product-source \
            --owner navigator > "$RUNNER_TEMP/product-contract-closure.json"
          python platform-tools/tooling/release/prepare_product_component.py \
            --product navigator \
            --product-root product-source \
            --product-repository "$PRODUCT_REPOSITORY" \
            --product-commit "$SOURCE_COMMIT" \
            --source-ref "$SOURCE_REF" \
            --channel "$CHANNEL" \
            --workspace-root workspace-builder \
            --workspace-commit "$WORKSPACE_BUILDER_COMMIT" \
            --release-tools-root platform-tools \
            --release-tools-commit "$PLATFORM_SOURCE_COMMIT" \
            --target-profile "$TARGET_PROFILE" \
            --python-executable "${{ steps.python-runtime.outputs.stagedPythonExecutable }}" \
            --uv-executable "${{ steps.python-runtime.outputs.uvExecutable }}" \
            --catalog workspace-catalog/governance/component-catalog-v1.json \
            --catalog-sha256 "$CATALOG_SHA256" \
            --sdk-fetch-result "$RUNNER_TEMP/platform-sdk-fetch-result.json" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --output "$OUTPUT_ROOT" > "$RUNNER_TEMP/product-component-result.json"
          python - "$RUNNER_TEMP/product-component-result.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result.get("ociImage") is not False:
              raise SystemExit("Navigator Python releases do not publish OCI artifacts")
          if result.get("pythonBundle") is not True or result.get("targetProfile") != os.environ["TARGET_PROFILE"]:
              raise SystemExit("Navigator native profile output is incomplete or mismatched")
          artifact = result.get("pythonArtifact")
          if not isinstance(artifact, str) or "\n" in artifact or "\r" in artifact:
              raise SystemExit("Navigator native artifact path is invalid")
          print(f"python_artifact={artifact}")
          PY

      - name: Attest Product Python bundle bytes
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.prepare.outputs.python_artifact }}
          github-token: ${{ github.token }}

      - name: Create native profile receipt and publication context
        env:
          PLATFORM_SOURCE_COMMIT: ${{ steps.sdk-index.outputs.source_commit }}
          PLATFORM_INDEX_DIGEST: ${{ steps.sdk-index.outputs.index_digest }}
          INDEX_PATH: ${{ steps.sdk-index.outputs.index_path }}
          SDK_FETCH_RESULT: ${{ runner.temp }}/platform-sdk-fetch-result.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-context/workspace-catalog/governance"
          cp workspace-catalog/component-catalog-release.json "$RUNNER_TEMP/release-context/workspace-catalog/"
          cp workspace-catalog/governance/*.json "$RUNNER_TEMP/release-context/workspace-catalog/governance/"
          cp "$INDEX_PATH" "$RUNNER_TEMP/release-context/platform-component-release-index-v1.json"
          cp workspace-builder/release-lock.json "$RUNNER_TEMP/release-context/workspace-release-lock.json"
          cp workspace-builder/packaging/python-runtime.lock.json "$RUNNER_TEMP/release-context/python-runtime.lock.json"
          python - "$OUTPUT_ROOT" "$RUNNER_TEMP/product-component-result.json" "$RUNNER_TEMP/python-runtime-receipt.json" "$SDK_FETCH_RESULT" "$OUTPUT_ROOT/native-profile-receipt.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          root, result_path, runtime_path, sdk_path, receipt_path = map(Path, sys.argv[1:])
          result = json.loads(result_path.read_text())
          runtime = json.loads(runtime_path.read_text())
          sdk = json.loads(sdk_path.read_text())
          catalog_meta = json.loads(Path("workspace-catalog/component-catalog-release.json").read_text())
          artifact, manifest = Path(result["pythonArtifact"]), Path(result["pythonManifest"])
          if not artifact.is_file() or not manifest.is_file(): raise SystemExit("native archive or manifest missing")
          receipt = {
              "targetProfile": os.environ["TARGET_PROFILE"], "catalogReleaseId": catalog_meta["releaseId"],
              "catalogSha256": "sha256:" + os.environ["CATALOG_SHA256"], "platformSourceCommit": os.environ["PLATFORM_SOURCE_COMMIT"],
              "platformIndexDigest": os.environ["PLATFORM_INDEX_DIGEST"], "workspaceBuilderCommit": result["workspaceBuilderCommit"],
              "releaseLockSha256": "sha256:" + result["releaseLockSha256"].removeprefix("sha256:"),
              "pythonRuntimeLockSha256": "sha256:" + hashlib.sha256(Path("workspace-builder/packaging/python-runtime.lock.json").read_bytes()).hexdigest(),
              "sdkManifestDigest": result["sdkManifestDigest"], "sdkArtifactDigest": result["sdkArtifactDigest"],
              "sdkWheelSha256": result["sdkWheelSha256"], "sdkReleaseId": result["sdkReleaseId"], "sdkFetchResult": sdk,
              "productRepository": os.environ["SOURCE_REPOSITORY"], "productCommit": os.environ["SOURCE_COMMIT"],
              "productRef": os.environ["SOURCE_REF"], "channel": os.environ["CHANNEL"], "releaseId": os.environ["RELEASE_ID"],
              "runId": os.environ["RUN_ID"], "runAttempt": os.environ["RUN_ATTEMPT"],
              "archive": str(artifact.relative_to(root)), "manifest": str(manifest.relative_to(root)),
              "stagedPythonExecutable": runtime["stagedPythonExecutable"], "uvExecutable": runtime["uvExecutable"],
          }
          receipt_path.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          PY

      - name: Upload native Product profile outputs
        uses: actions/upload-artifact@v4
        with:
          name: navigator-${{ matrix.target_profile }}
          path: |
            ${{ runner.temp }}/component-release/artifacts/*.tar.gz
            ${{ runner.temp }}/component-release/manifests/*.manifest.json
            ${{ runner.temp }}/component-release/native-profile-receipt.json
          if-no-files-found: error
          retention-days: 2

      - name: Upload shared publication context from Ubuntu 24.04 row
        if: matrix.target_profile == 'linux-ubuntu-24.04-x86_64-python-3.12'
        uses: actions/upload-artifact@v4
        with:
          name: navigator-publication-context
          path: ${{ runner.temp }}/release-context/
          if-no-files-found: error
          retention-days: 2

  component-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [product-tests, product-native-build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CHANNEL: ${{ github.ref == 'refs/heads/develop' && 'preview' || 'stable' }}
      RELEASE_ID: ${{ (github.ref == 'refs/heads/develop' && 'preview-' || 'stable-') }}${{ github.sha }}
      WORKSPACE_BUILDER_COMMIT: cda6fb5104373293575342b2e6868cdd98a3d626
    steps:
      - name: Set component release output root
        run: printf 'RELEASE_ROOT=%s/component-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Download native profiles
        uses: actions/download-artifact@v4
        with:
          pattern: navigator-linux-ubuntu-*-x86_64-python-3.12
          path: ${{ runner.temp }}/native-profiles
          merge-multiple: false
      - name: Download shared publication context
        uses: actions/download-artifact@v4
        with:
          name: navigator-publication-context
          path: ${{ runner.temp }}/release-context
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned canonical JSON verifier
        run: python -m pip install --disable-pip-version-check rfc8785==0.1.4
      - name: Require identical native profile receipts
        id: receipts
        env:
          PROFILE_ROOT: ${{ runner.temp }}/native-profiles
          CONTEXT_ROOT: ${{ runner.temp }}/release-context
        run: |
          set -euo pipefail
          python - "$PROFILE_ROOT" "$CONTEXT_ROOT" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, os, re, sys
          from pathlib import Path
          profiles = {"linux-ubuntu-22.04-x86_64-python-3.12", "linux-ubuntu-24.04-x86_64-python-3.12"}
          root, context = map(Path, sys.argv[1:])
          dirs = [p for p in root.iterdir() if p.is_dir()]
          if {p.name.removeprefix("navigator-") for p in dirs} != profiles: raise SystemExit("missing or extra native profile")
          receipts = []
          for directory in dirs:
              files = list(directory.rglob("native-profile-receipt.json"))
              if len(files) != 1: raise SystemExit("profile receipt missing or ambiguous")
              receipts.append(json.loads(files[0].read_text()))
          keys = ("catalogReleaseId", "catalogSha256", "platformSourceCommit", "platformIndexDigest", "workspaceBuilderCommit",
                  "releaseLockSha256", "pythonRuntimeLockSha256", "sdkManifestDigest", "sdkArtifactDigest", "sdkWheelSha256",
                  "sdkReleaseId", "sdkFetchResult", "productRepository", "productCommit", "productRef", "channel", "releaseId", "runId", "runAttempt")
          for key in keys:
              if any(r.get(key) != receipts[0].get(key) for r in receipts[1:]): raise SystemExit("profile receipts disagree: " + key)
          ref = os.environ["GITHUB_REF"]
          values = {"productRepository": os.environ["GITHUB_REPOSITORY"], "productCommit": os.environ["GITHUB_SHA"],
                    "productRef": ref, "channel": "preview" if ref == "refs/heads/develop" else "stable",
                    "releaseId": ("preview-" if ref == "refs/heads/develop" else "stable-") + os.environ["GITHUB_SHA"],
                    "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "workspaceBuilderCommit": os.environ["WORKSPACE_BUILDER_COMMIT"]}
          if any(receipts[0].get(k) != v for k, v in values.items()): raise SystemExit("receipt does not bind current source/run")
          lock = (context / "workspace-release-lock.json").read_bytes()
          if "sha256:" + hashlib.sha256(lock).hexdigest() != receipts[0]["releaseLockSha256"]: raise SystemExit("release-lock mismatch")
          runtime_lock = (context / "python-runtime.lock.json").read_bytes()
          if "sha256:" + hashlib.sha256(runtime_lock).hexdigest() != receipts[0]["pythonRuntimeLockSha256"]: raise SystemExit("Python runtime lock mismatch")
          catalog = context / "workspace-catalog/governance/component-catalog-v1.json"
          meta = json.loads((context / "workspace-catalog/component-catalog-release.json").read_text())
          cd = "sha256:" + hashlib.sha256(catalog.read_bytes()).hexdigest()
          if cd != receipts[0]["catalogSha256"] or meta.get("catalogSha256") != cd or meta.get("releaseId") != receipts[0]["catalogReleaseId"]:
              raise SystemExit("catalog identity mismatch")
          import rfc8785
          index = json.loads((context / "platform-component-release-index-v1.json").read_text())
          di = "sha256:" + hashlib.sha256(rfc8785.dumps({k:v for k,v in index.items() if k != "indexDigest"})).hexdigest()
          if di != receipts[0]["platformIndexDigest"] or index["source"]["commit"] != receipts[0]["platformSourceCommit"]:
              raise SystemExit("Platform source/index mismatch")
          for r in receipts:
              base = root / ("navigator-" + r["targetProfile"])
              if not (base / r["archive"]).is_file() or not (base / r["manifest"]).is_file(): raise SystemExit("profile output missing")
          if not re.fullmatch("[0-9a-f]{40}", receipts[0]["platformSourceCommit"]): raise SystemExit("invalid Platform SHA")
          print("platform_source_commit=" + receipts[0]["platformSourceCommit"])
          print("catalog_sha256=" + cd.removeprefix("sha256:"))
          PY
      - name: Check out attested Platform release tools
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Platform
          ref: ${{ steps.receipts.outputs.platform_source_commit }}
          path: platform-tools
          persist-credentials: false
      - name: Check out exact Product source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: product-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned release tooling
        run: python -m pip install --disable-pip-version-check build pyyaml pytest rfc8785==0.1.4 -r platform-tools/tooling/release/requirements.txt
      - name: Verify exact source tuple and unused immutable release
        env:
          CYRENE_IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.CYRENE_IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git -C product-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          case "$CHANNEL:$SOURCE_REF" in stable:refs/heads/main|stable:refs/heads/release|preview:refs/heads/develop) ;; *) exit 2 ;; esac
          python platform-tools/tooling/release/validate_product_contract.py --repository product-source --owner navigator > "$RUNNER_TEMP/product-contract-closure.json"
          python platform-tools/tooling/release/preflight_component_release.py --repository "$SOURCE_REPOSITORY" --release-id "$RELEASE_ID" --channel "$CHANNEL" --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" --repository-root product-source
      - name: Test attested Platform release tooling
        env:
          PYTHONPATH: platform-tools
          CYRENE_COMPONENT_CATALOG: ${{ runner.temp }}/release-context/workspace-catalog/governance/component-catalog-v1.json
          CYRENE_COMPONENT_CATALOG_SHA256: ${{ steps.receipts.outputs.catalog_sha256 }}
        run: python -m pytest platform-tools/tooling/release/tests -q
      - name: Verify Platform SDK index and provenance
        run: |
          python platform-tools/tooling/release/validate_component_schema.py --kind index --document "$RUNNER_TEMP/release-context/platform-component-release-index-v1.json" --schema-dir "$RUNNER_TEMP/release-context/workspace-catalog/governance"
          python platform-tools/tooling/release/component_artifacts.py verify-index --index "$RUNNER_TEMP/release-context/platform-component-release-index-v1.json" --catalog "$RUNNER_TEMP/release-context/workspace-catalog/governance/component-catalog-v1.json" --verify-run --verify-attestation
      - name: Assemble two native manifests and create index
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ROOT/artifacts" "$RELEASE_ROOT/manifests"
          for profile in linux-ubuntu-22.04-x86_64-python-3.12 linux-ubuntu-24.04-x86_64-python-3.12; do
            src="$RUNNER_TEMP/native-profiles/navigator-$profile"
            cp "$src"/artifacts/*.tar.gz "$RELEASE_ROOT/artifacts/"
            cp "$src"/manifests/*.manifest.json "$RELEASE_ROOT/manifests/"
          done
          test "$(find "$RELEASE_ROOT/artifacts" -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find "$RELEASE_ROOT/manifests" -maxdepth 1 -name '*.manifest.json' | wc -l)" -eq 2
          for m in "$RELEASE_ROOT"/manifests/*.manifest.json; do
            python platform-tools/tooling/release/validate_component_schema.py --kind manifest --document "$m" --schema-dir "$RUNNER_TEMP/release-context/workspace-catalog/governance"
          done
          python platform-tools/tooling/release/component_artifacts.py index --manifest-dir "$RELEASE_ROOT/manifests" --channel "$CHANNEL" --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --workflow "$SOURCE_REPOSITORY/.github/workflows/component-release.yml" --output "$RELEASE_ROOT/component-release-index-v1.json"
          python platform-tools/tooling/release/validate_component_schema.py --kind index --document "$RELEASE_ROOT/component-release-index-v1.json" --schema-dir "$RUNNER_TEMP/release-context/workspace-catalog/governance"
      - name: Download and verify detached bundle attestations
        run: |
          set -euo pipefail
          for subject in "$RELEASE_ROOT"/artifacts/*.tar.gz; do
            tmp="$RUNNER_TEMP/attestation-download"; rm -rf "$tmp"; mkdir -p "$tmp"
            (cd "$tmp" && gh attestation download "$subject" --repo "$SOURCE_REPOSITORY" --limit 1)
            bundle="$(find "$tmp" -maxdepth 1 -type f \( -name 'sha256-*.jsonl' -o -name 'sha256:*.jsonl' \) | head -n1)"
            test -n "$bundle"
            mv "$bundle" "$subject.attestation.jsonl"
            gh attestation verify "$subject" --bundle "$subject.attestation.jsonl" --repo "$SOURCE_REPOSITORY" \
              --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/component-release.yml" \
              --source-ref "$SOURCE_REF" --source-digest "$SOURCE_COMMIT" \
              --predicate-type https://slsa.dev/provenance/v1 --format json >/dev/null
          done
      - name: Attest exact component index bytes
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/component-release/component-release-index-v1.json
          github-token: ${{ github.token }}
      - name: Download and verify detached index attestation
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/index-attestation"; mkdir -p "$tmp"
          (cd "$tmp" && gh attestation download "$RELEASE_ROOT/component-release-index-v1.json" --repo "$SOURCE_REPOSITORY" --limit 1)
          bundle="$(find "$tmp" -maxdepth 1 -type f \( -name 'sha256-*.jsonl' -o -name 'sha256:*.jsonl' \) | head -n1)"
          test -n "$bundle"
          mv "$bundle" "$RELEASE_ROOT/component-release-index-v1.json.attestation.jsonl"
          gh attestation verify "$RELEASE_ROOT/component-release-index-v1.json" \
            --bundle "$RELEASE_ROOT/component-release-index-v1.json.attestation.jsonl" \
            --repo "$SOURCE_REPOSITORY" \
            --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/component-release.yml" \
            --source-ref "$SOURCE_REF" --source-digest "$SOURCE_COMMIT" \
            --predicate-type https://slsa.dev/provenance/v1 --format json >/dev/null
      - name: Create one draft immutable release
        run: |
          set -euo pipefail
          assets=("$RELEASE_ROOT"/artifacts/*.tar.gz "$RELEASE_ROOT"/manifests/*.manifest.json "$RELEASE_ROOT"/artifacts/*.attestation.jsonl "$RELEASE_ROOT/component-release-index-v1.json" "$RELEASE_ROOT/component-release-index-v1.json.attestation.jsonl")
          test "${#assets[@]}" -eq 8
          args=("$RELEASE_ID" "${assets[@]}" --draft --target "$SOURCE_COMMIT" --title "Cyrene component release $RELEASE_ID" --notes "Immutable component release for $SOURCE_REPOSITORY@$SOURCE_COMMIT.")
          if [ "$CHANNEL" = preview ]; then args+=(--prerelease); fi
          gh release create "${args[@]}" --repo "$GITHUB_REPOSITORY"
          number="$(gh release view "$RELEASE_ID" --repo "$SOURCE_REPOSITORY" --json databaseId --jq .databaseId)"
          gh api --method PATCH "repos/$SOURCE_REPOSITORY/releases/$number" -F draft=false >/dev/null
          test "$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$RELEASE_ID" --jq .immutable)" = true
      - name: Verify published index, manifests, artifacts and attestations
        run: |
          set -euo pipefail
          python platform-tools/tooling/release/component_artifacts.py verify-index --index "$RELEASE_ROOT/component-release-index-v1.json" --catalog "$RUNNER_TEMP/release-context/workspace-catalog/governance/component-catalog-v1.json" --verify-release --verify-attestation-only
          for manifest in "$RELEASE_ROOT"/manifests/*.manifest.json; do
            name="$(python - "$manifest" <<'PY'
          import json,sys
          from pathlib import Path
          from urllib.parse import urlparse
          print(Path(urlparse(json.loads(Path(sys.argv[1]).read_text())["artifact"]["uri"]).path).name)
          PY
          )"
            python platform-tools/tooling/release/component_artifacts.py verify --manifest "$manifest" --catalog "$RUNNER_TEMP/release-context/workspace-catalog/governance/component-catalog-v1.json" --artifact "$RELEASE_ROOT/artifacts/$name" --verify-release --verify-attestation-only
            gh attestation verify "$RELEASE_ROOT/artifacts/$name" --bundle "$RELEASE_ROOT/artifacts/$name.attestation.jsonl" --repo "$SOURCE_REPOSITORY" --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/component-release.yml" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_COMMIT" --predicate-type https://slsa.dev/provenance/v1 --format json >/dev/null
          done
