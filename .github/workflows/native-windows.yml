name: native-windows

on:
  pull_request:
    branches: [develop, main, release]
  push:
    branches: [develop, main, release, 'feat/**', 'fix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.13.0'
  PNPM_VERSION: '11.7.0'
  RUST_TOOLCHAIN: '1.97.1-x86_64-pc-windows-msvc'

jobs:
  native-integration:
    name: windows / native-supervisor
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install locked Python tool and environment
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check uv==0.12.3
          if ($LASTEXITCODE -ne 0) { throw 'Locked uv installation failed.' }
          uv sync --frozen --group dev
          if ($LASTEXITCODE -ne 0) { throw 'Navigator Python environment setup failed.' }

      - name: Prepare exact Harness source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $upstream = Join-Path $env:RUNNER_TEMP 'deepseek-harness'
          node scripts/prepare-harness.mjs --root $upstream --install --build --link
          if ($LASTEXITCODE -ne 0) { throw 'Harness source verification failed.' }
          "CYRENE_DSH_ROOT=$upstream" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Navigator Harness adapters
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tsc = Join-Path $env:CYRENE_DSH_ROOT 'node_modules/typescript/bin/tsc'
          node $tsc -p harness/tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'Navigator Harness adapter build failed.' }

      - name: Build static native host
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $output = Join-Path $env:RUNNER_TEMP 'cyrene-native-host'
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/build-native-host.ps1 -OutputRoot $output
          if ($LASTEXITCODE -ne 0) { throw 'Static native host build failed.' }
          $native = Join-Path $output 'cyrene-native-host.exe'
          if (-not (Test-Path $native -PathType Leaf)) { throw 'Native host is missing.' }
          "CYRENE_NATIVE_HOST=$native" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run native supervisor matrix
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $fixture = Join-Path $env:RUNNER_TEMP 'native-matrix-host.exe'
          rustc --edition 2021 -C opt-level=2 harness/tests/fixtures/native-matrix-host.rs -o $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native matrix fixture build failed.' }
          $env:CYRENE_NATIVE_MATRIX_BINARY = $fixture
          node --test harness/tests/native.integration.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows native supervisor matrix failed.' }

      - name: Build portable subagent fixture wrapper
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustfmt --edition 2021 --check harness/tests/fixtures/node-subagent-wrapper.rs
          $wrapper = Join-Path $env:RUNNER_TEMP 'node-subagent-wrapper.exe'
          rustc --edition 2021 -C opt-level=2 harness/tests/fixtures/node-subagent-wrapper.rs -o $wrapper
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $wrapper -PathType Leaf)) { throw 'Portable subagent fixture wrapper build failed.' }
          "CYRENE_TEST_SUBAGENT_WRAPPER=$wrapper" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Windows Python persistence and Work API fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv run pytest -q `
            tests/test_persistence_api.py `
            tests/test_serve_local.py `
            tests/test_work_api.py `
            tests/test_work_contract.py `
            tests/test_work_runtime.py `
            tests/test_work_tool_routes.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows persistence and Work API fixtures failed.' }

      - name: Run Windows headless executor and Work fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --test `
            harness/tests/executor.integration.test.mjs `
            harness/tests/subagents.test.mjs `
            harness/tests/tool-providers.test.mjs `
            harness/tests/work-tools.test.mjs `
            harness/tests/workflows.integration.test.mjs `
            harness/tests/round1.integration.test.mjs `
            harness/tests/cloud-connections.integration.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows headless executor and Work fixtures failed.' }

      - name: Verify native imports
        run: node --test harness/tests/windows-native-imports.test.mjs
