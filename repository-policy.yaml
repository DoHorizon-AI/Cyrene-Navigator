schema_version: cyrene.repository-policy.v1
repository:
  logical_name: cyrene-navigator
  lifecycle_class: PUBLIC_PRODUCT
  visibility: public
  source_owner: Client Applications Team
  remote_default_branch: main
  integration_branch: main
  release_branch: main
  default_branch: main
ownership:
  owns:
  - Harness adapters and Product-facing service APIs
  - Session persistence and explicit Product handoffs
  - Navigator local Artifact publication adapter
  - Codex rollout import native host
  does_not_own:
  - Server-side training, serving, evaluation, or dataset execution
  - Product capability payload contracts or Plugin implementations
  - Platform installation, compatibility, or control-plane authority
  - Browser WebUI or native Windows presentation; those live in the optional cyrene.ui.navigator Plugin
build:
  independent: true
  build_systems:
  - python
  - cargo
  - npm
artifacts:
  package_units:
  - navigator-python-service
  - navigator-harness
  native_binaries:
  - cyrene-native-host
  packaging:
    release_artifacts: false
distribution:
  role: COMPONENT_RELEASE
  profiles:
  - navigator_core
  standalone_user_product: false
integration:
  multi_repo_required: true
authorities:
  ci: github
  release: manual_github_release
  deployment: community
trust:
  public_requires_private: false
versioning:
  scheme: semver
  scope: repository
  tag_strategy: repository
  tag_pattern: v{version}
  automated_release: false
