schema_version: cyrene.repository-policy.v1
repository:
  logical_name: cyrene-navigator
  lifecycle_class: PUBLIC_PRODUCT
  visibility: public
  source_owner: Client Applications Team
  remote_default_branch: develop
  integration_branch: develop
  release_branch: release
  default_branch: develop
ownership:
  owns:
  - Pinned DeepSeek Harness profile and Cyrene Harness adapters
  - Local session persistence API and authoritative event store
  - Bounded Product workspace-read API and explicit Product handoffs
  - Codex rollout import native host and local Artifact publication adapter
  - Harness UI adapters for the pinned upstream Harness profile
  does_not_own:
  - The Native Client application shell and primary user-facing presentation
  - Other Product capability payload contracts
  - Other Product services (training, serving, evaluation, dataset processing, gateway governance)
  - Platform installation, kernel supervision, or cluster lease authority
  - External plugin capability implementations
build:
  independent: true
  build_systems:
  - python
  - cargo
  - npm
artifacts:
  package_units:
  - navigator-python-service
  - navigator-harness
  native_binaries:
  - cyrene-native-host
  packaging:
    release_artifacts: false
distribution:
  role: COMPONENT_RELEASE
  profiles:
  - navigator_core
  standalone_user_product: false
integration:
  multi_repo_required: true
authorities:
  ci: github
  release: manual_github_release
  deployment: community
trust:
  public_requires_private: false
versioning:
  scheme: semver
  scope: repository
  tag_strategy: repository
  tag_pattern: v{version}
  automated_release: false
