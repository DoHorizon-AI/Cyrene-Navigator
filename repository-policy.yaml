schema_version: cyrene.repository-policy.v1
repository:
  logical_name: cyrene-navigator
  lifecycle_class: PUBLIC_PRODUCT
  visibility: public
  source_owner: Client Applications Team
  remote_default_branch: develop
  integration_branch: develop
  release_branch: release
  default_branch: develop
ownership:
  owns:
  - DeepSeek harness secondary development and Harness runtime adapter
  - Built-in Harness component integration for Native Client (Cyrene-Client)
  - Authoritative local session persistence and event store for Harness
  - Codex rollout import native host and local Artifact publication adapter
  does_not_own:
  - Any user interface (UI) or presentation layer; all UI belongs strictly to Native Client (Cyrene-Client)
  - Other unrelated service features (training, serving, evaluation, dataset execution, gateway governance)
  - Platform installation, kernel supervision, or cluster lease authority
  - External plugin capability implementations
build:
  independent: true
  build_systems:
  - python
  - cargo
  - npm
artifacts:
  package_units:
  - navigator-python-service
  - navigator-harness
  native_binaries:
  - cyrene-native-host
  packaging:
    release_artifacts: false
distribution:
  role: COMPONENT_RELEASE
  profiles:
  - navigator_core
  standalone_user_product: false
integration:
  multi_repo_required: true
authorities:
  ci: github
  release: manual_github_release
  deployment: community
trust:
  public_requires_private: false
versioning:
  scheme: semver
  scope: repository
  tag_strategy: repository
  tag_pattern: v{version}
  automated_release: false
